org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Publishable artifacts are "Absolute Order 2.0.0"; jar filenames encode loader + MC version.
mod_version = 2.0.0-ascension.12
maven_group = io.github.marcsanzdev
archives_name = AbsoluteOrder
enabled_platforms = fabric,neoforge

# Minecraft — target version. 1.21.1 is render era E4 (GuiGraphics + RenderSystem, pre-RenderPipelines),
# but shares the 1.21 data layer (DataComponents, registries, networking) with the 1.21.11 reference.
minecraft_version = 1.21.1

# Dependencies. Copied from the 1.21.11 reference (Mojmap, loom 1.13-SNAPSHOT), versions pinned to 1.21.1.
architectury_api_version = 13.0.11
fabric_loader_version = 0.16.14
fabric_api_version = 0.116.15+1.21.1
neoforge_version = 21.1.248

# Cloth Config (config screen) + ModMenu (Fabric config host).
cloth_config_version = 15.0.140
modmenu_version = 11.0.3

# Recipe-viewer compat (compile-only APIs; users provide the runtime mod).
emi_version = 1.1.22+1.21.1
rei_version = 16.0.799






