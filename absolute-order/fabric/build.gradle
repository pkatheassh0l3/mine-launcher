plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url "https://maven.terraformersmc.com/releases/" } // Mod Menu
    maven { url "https://maven.shedaniel.me/" } // Cloth Config
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API (Fabric).
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    // Cloth Config (Fabric) — the real config-screen impl; a required dependency of the config screen.
    modImplementation("me.shedaniel.cloth:cloth-config-fabric:$rootProject.cloth_config_version") {
        exclude group: "net.fabricmc.fabric-api"
    }
    // ModMenu hosts the config button. Compile the ModMenuApi entrypoint against it; it stays optional at
    // runtime (declared "suggests" in fabric.mod.json), and is loaded in dev so the config screen is testable.
    modCompileOnly("com.terraformersmc:modmenu:$rootProject.modmenu_version") { exclude group: "net.fabricmc" }
    modLocalRuntime("com.terraformersmc:modmenu:$rootProject.modmenu_version") { exclude group: "net.fabricmc" }

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
    // Publishable name: AbsoluteOrder-2.0.0-fabric-mc<version>.jar
    archiveClassifier = "fabric-mc${rootProject.minecraft_version}"
}
