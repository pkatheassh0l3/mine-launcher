plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Architectury API (NeoForge).
    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    // Cloth Config (NeoForge) — the real config-screen impl for the IConfigScreenFactory registration.
    modImplementation "me.shedaniel.cloth:cloth-config-neoforge:$rootProject.cloth_config_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
    // Publishable name: AbsoluteOrder-2.0.0-neoforge-mc<version>.jar
    archiveClassifier = "neoforge-mc${rootProject.minecraft_version}"
}

dependencies { compileOnly files("${findProperty('storageCompatDir') ?: '../../../compat'}/sophisticatedcore-1.21.1-1.5.1.2341.jar") }

if (project.hasProperty('storageValidation')) {
    sourceSets.main.java.srcDir 'src/validation/java'
    dependencies { compileOnly files("${findProperty('storageCompatDir') ?: '../../../compat'}/sophisticatedbackpacks-1.21.1-3.26.3.2158.jar") }
}

if (project.hasProperty('jeiValidation')) { sourceSets.main.java.srcDir 'src/jeiValidation/java' }
